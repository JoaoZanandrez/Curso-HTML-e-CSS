<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: chocolate;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: blueviolet;
            border: 1px solid black; 
            text-align: center;
        }
        
        div#cxA {
            /*flex-shrink: 0;
            flex-grow: 0;
            flex-basis: 150px;*/

            flex: 0 0 150px; /* Shorthand para flex-grow, flex-shrink e flex-basis */
        }

        div#cxB {
            flex-shrink: 2;
            flex-grow: 0;
            flex-basis: 150px;

            flex: 1 2 150px;
        }

        div#cxC {
            flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 150px;

            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
